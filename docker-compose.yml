services:
  tenant-sites:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tenant-sites
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - PORT=4004
      - NEXTAUTH_SECRET=tenant-sites-super-secret-key-2026
      - NEXTAUTH_URL=http://localhost:4004
      - NEXT_PUBLIC_PLATFORM_PORTAL=http://localhost:4000
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4004/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
